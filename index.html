<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>talia quiz</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Niconne&display=swap" rel="stylesheet" />
  </head>
  <body>
    <h1>Quiz About Me!</h1>
    <hr />
    <!-- Movie Question -->
    <form id="movie-form">
      <label>
        🎥 What is my favorite movie?
        <select id="movie-answer">
          <option value="movie1">aristocats</option>
          <option value="movie2">harry potter</option>
          <option value="movie3">peunuts</option>
          <option value="movie4">coraline</option>
        </select>
      </label>
      <button type="submit">Check Movie Answer</button>
    </form>
    <div id="movie-result">
      <p id="movie-text"></p>
      <img id= "aristocats-img" src="https://m.media-amazon.com/images/I/712eWQMlmQL._AC_UF894,1000_QL80_.jpg" style="display:none;" width="200;"/>
    </div>
    <hr />
    <!-- Book Question -->
    <form id="book-form">
      <label>
        📖 What is my favorite book?
        <select id="book-answer">
          <option value="book1">little women</option>
          <option value="book2">narnia</option>
          <option value="book3">Orbiting Jupiter</option>
          <option value="book4">dracula</option>
        </select>
      </label>
      <button type="submit">Check Book Answer</button>
    </form>
    <div id="book-result">
      <p id="book-text"></p>
    <img id= "oj-img" src="https://m.media-amazon.com/images/I/61CXDzNXkQL._AC_UF1000,1000_QL80_.jpg" style="display:none;" width="200;">
    </div>
     <hr />
    <!-- Song Question -->
    <form id="song-form">
      <label>
        🎶 What is my favorite song?
        <select id="song-answer">
          <option value="song1">starting over</option>
          <option value="song2">bodysnatchers</option>
          <option value="song3">visions of gideon</option>
          <option value="song4">bigmouth strikes again</option>
        </select>
      </label>
      <button type="submit">Check Book Answer</button>
    </form>
    <div id="song-result" style="opacity:1;">
      <p id="song-text"></p>
    <img id= "visions-img" src="https://m.media-amazon.com/images/I/51YduLKLxvL._UXNaN_FMjpg_QL85_.jpg" style="display:none;" width="200"/>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      //========================Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        $("#movie-result").hide();
        $("#aristocats-img").hide();
        if (answer === "movie1") {
          $("#movie-text").text("YEP!!!🎉");
          $("#aristocats-img").show();
        } 
        else {
          $("#movie-text").text("Try Again...😞");
        }
        $("#movie-result").slideDown(1000);
      });

      //=======================Book Question jQuery Code
      $("#book-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#book-answer");
        var answer = $answer.val();

        $("#book-result").hide();
        $("#oj-img").hide(); 
        if (answer === "book3") {
          $("#book-text").text("YESSSS!");
          $("#oj-img").show();
        } 
        else {
          $("#book-text").text("Try Again!");
        }
        $("#book-result").slideDown(1000);
      });

            //=======================Song Question jQuery Code
      $("#song-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#song-answer");
        var answer = $answer.val();

        $("#song-result").css("opacity", 0);
        $("#visions-img").hide();        
        if (answer === "song3") {
          $("#song-text").text("YESSSS!😋");
          $("#visions-img").show();
        } 
        else {
          $("#song-text").text("Try Again!");
        }
          $("#song-result").animate({opacity:1},1000);
      })
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
